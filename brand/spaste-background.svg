<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- sPaste: grape, a muted red-violet for calm and trust, apart from
       sWalk's violet; the only gradient in the icon. -->
  <defs>
    <linearGradient id="spaste" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b59b6"/>
      <stop offset="1" stop-color="#6c3483"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#spaste)"/>
</svg>
